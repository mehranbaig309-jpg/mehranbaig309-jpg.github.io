<style>
  :root{--paper:#FBF5EA; --paper-card:#FFFFFF; --ink:#242640; --ink-soft:#615E78; --line:#E7DCC6; --rule:#D9CDAF; --indigo:#5B54D6; --coral:#E85C42;}

  header{padding:28px 6vw 0; border-bottom:1px solid var(--rule);}
  .brandrow{display:flex; justify-content:space-between; align-items:baseline; padding-bottom:18px; flex-wrap:wrap; gap:10px;}
  .navlinks{display:flex; gap:8px; align-items:center;}
  .navlinks a{font-family:'IBM Plex Mono',monospace; font-size:12px; color:#5B54D6; text-decoration:none; border:1px solid #5B54D6; padding:4px 10px; border-radius:2px;}
  .navlinks a.active{background:#5B54D6; color:#fff;}
  .hero{padding:48px 0 56px;}
  .hero h1{font-family:'Fraunces',serif; font-size:clamp(40px,6.5vw,86px); line-height:0.98; margin-bottom:18px;}
  .searchbar{max-width:640px; margin-top:34px; display:flex; border:1.5px solid var(--indigo); border-radius:3px;}
  .searchbar input{flex:1; border:none; background:transparent; padding:14px 16px; font-size:15px; outline:none;}
  .catalog{display:grid; grid-template-columns:200px 1fr; gap:0; padding:0 6vw 80px;}
  .index-col{padding-top:44px; position:sticky; top:0; align-self:start;}
  .cat-btn{display:flex; justify-content:space-between; width:100%; background:none; border:none; border-bottom:1px solid var(--line); padding:11px 4px; font-size:14.5px; cursor:pointer;}
  .cat-btn.active{color:var(--indigo); font-weight:600;}
  .cards-col{padding-top:44px; border-left:1px solid var(--rule); padding-left:36px;}
  .cards-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:1px; background:var(--rule); border:1px solid var(--rule);}
  .card{background:var(--paper-card); padding:22px 20px 20px; display:flex; flex-direction:column; min-height:220px; border-top:4px solid var(--ink);}
  .card h3{font-family:'Fraunces',serif; font-size:22px; margin:8px 0;}
  .card-foot{display:flex; justify-content:space-between; border-top:1px solid var(--line); padding-top:12px; margin-top:10px;}
  .card-link{font-weight:600; color:var(--indigo); text-decoration:none; border-bottom:1px solid var(--indigo);}
  .pagination{display:flex; justify-content:space-between; padding:24px 0; font-family:'IBM Plex Mono',monospace; font-size:13px;}
  footer{border-top:1px solid var(--rule); padding:30px 6vw 40px; display:flex; justify-content:space-between; font-size:12px; color:var(--ink-soft);}
  @media (max-width:820px){ .catalog{grid-template-columns:1fr;} .index-col{position:static; display:flex; flex-wrap:wrap;} .cards-col{border-left:none; padding-left:0;} }
</style>

<script>
const TOOLS = [
  {name:"Windsurf", cat:"Code", desc:"Agentic IDE that plans complex tasks.", price:"Free", url:"https://codeium.com/windsurf"},
  {name:"Bolt.new", cat:"Code", desc:"Full-stack web apps in your browser.", price:"Free", url:"https://bolt.new"},
  {name:"ChatGPT", cat:"Writing & Chat", desc:"The global standard for AI chat.", price:"Free", url:"https://chat.openai.com"},
  {name:"Claude", cat:"Writing & Chat", desc:"Strongest reasoning and document writing.", price:"Free", url:"https://claude.ai"},
  {name:"Gemini", cat:"Writing & Chat", desc:"Google's workspace assistant.", price:"Free", url:"https://gemini.google.com"},
  {name:"Perplexity", cat:"Research", desc:"AI search with citations.", price:"Free", url:"https://www.perplexity.ai"},
  {name:"NotebookLM", cat:"Research", desc:"Documents to audio/summary.", price:"Free", url:"https://notebooklm.google"},
  {name:"Midjourney", cat:"Image", desc:"High-end artistic generations.", price:"Paid", url:"https://www.midjourney.com"},
  {name:"DALL·E 3", cat:"Image", desc:"Built into ChatGPT Plus.", price:"Paid", url:"https://openai.com/dall-e-3"},
  {name:"Ideogram", cat:"Image", desc:"Best for text in images.", price:"Free", url:"https://ideogram.ai"},
  {name:"Adobe Firefly", cat:"Image", desc:"Commercial AI for Photoshop.", price:"Free", url:"https://firefly.adobe.com"},
  {name:"Runway", cat:"Video", desc:"Text-to-video creative suite.", price:"Paid", url:"https://runwayml.com"},
  {name:"Pika", cat:"Video", desc:"Fast AI video for social media.", price:"Free", url:"https://pika.art"},
  {name:"ElevenLabs", cat:"Audio", desc:"Most realistic voices.", price:"Free", url:"https://elevenlabs.io"},
  {name:"Suno", cat:"Audio", desc:"AI song and vocal generation.", price:"Free", url:"https://suno.com"},
  {name:"GitHub Copilot", cat:"Code", desc:"Industry AI pair programmer.", price:"Paid", url:"https://github.com/features/copilot"},
  {name:"Cursor", cat:"Code", desc:"AI-native multi-file editor.", price:"Free", url:"https://cursor.sh"},
  {name:"Claude Code", cat:"Code", desc:"Terminal-based coding agent.", price:"Paid", url:"https://claude.com/claude-code"},
  {name:"Replit", cat:"Code", desc:"Browser IDE with AI agent.", price:"Free", url:"https://replit.com"},
  {name:"Notion AI", cat:"Productivity", desc:"Writing assistant inside Notion.", price:"Paid", url:"https://www.notion.com/product/ai"},
  {name:"Otter.ai", cat:"Productivity", desc:"Transcription for meetings.", price:"Free", url:"https://otter.ai"},
  {name:"Synthesia", cat:"Video", desc:"Create videos with AI avatars.", price:"Paid", url:"https://synthesia.io"},
  {name:"Gamma", cat:"Design & Slides", desc:"AI slide deck generator.", price:"Free", url:"https://gamma.app"},
  {name:"Canva", cat:"Design & Slides", desc:"Magic design tools in Canva.", price:"Free", url:"https://canva.com"},
  {name:"Framer", cat:"Design & Slides", desc:"Build websites with AI.", price:"Free", url:"https://framer.com"},
  {name:"Galileo", cat:"Design & Slides", desc:"AI for UI/UX screen design.", price:"Paid", url:"https://usegalileo.ai"},
  {name:"Elicit", cat:"Research", desc:"AI literature review assistant.", price:"Free", url:"https://elicit.com"},
  {name:"Consensus", cat:"Research", desc:"Scientific paper search engine.", price:"Free", url:"https://consensus.app"},
  {name:"Udio", cat:"Audio", desc:"High-fidelity AI music maker.", price:"Free", url:"https://udio.com"},
  {name:"Descript", cat:"Audio", desc:"Edit audio by editing text.", price:"Free", url:"https://descript.com"}
];
const CAT_COLORS = {"Writing & Chat":"#5B54D6", "Research":"#0E8F82", "Image":"#E85C42", "Video":"#E8A73B", "Audio":"#2F80ED", "Code":"#2FA84F", "Productivity":"#D6336C", "Design & Slides":"#9D5CE0"};
const grid = document.getElementById('cardsGrid');
const catListEl = document.getElementById('catList');
const searchInput = document.getElementById('searchInput');
let activeCat = "All";
const categories = ["All", ...new Set(TOOLS.map(t=>t.cat))];
function renderCatList(){ catListEl.innerHTML = categories.map(c => `<button class="cat-btn ${c===activeCat?'active':''}" onclick="filterCat('${c}')">${c}</button>`).join(''); }
function filterCat(cat){ activeCat = cat; renderCatList(); renderCards(); }
function renderCards(){
  const q = searchInput.value.toLowerCase();
  const filtered = TOOLS.filter(t => (activeCat==="All" || t.cat===activeCat) && (t.name.toLowerCase().includes(q)));
  grid.innerHTML = filtered.map((t,i) => `<div class="card" style="border-top-color:${CAT_COLORS[t.cat]}"><span>No. ${String(i+1).padStart(3,'0')}</span><h3>${t.name}</h3><p>${t.desc}</p><div class="card-foot"><span>${t.price}</span><a class="card-link" href="${t.url}" target="_blank">Visit ↗</a></div></div>`).join('');
}
searchInput.addEventListener('input', renderCards);
renderCatList(); renderCards();
</script>
