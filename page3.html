const CAT_COLORS = {"Built-In":"#E85C42", "Hardware":"#2FA84F", "Image":"#E85C42", "Audio":"#2F80ED", "Video":"#E8A73B", "Productivity":"#D6336C", "Crypto AI":"#E8A73B", "Models":"#5B54D6", "Search":"#0E8F82", "Travel":"#2FA84F"};
const grid = document.getElementById('cardsGrid');
const searchInput = document.getElementById('searchInput');

function renderCards(){
  const q = searchInput.value.toLowerCase();
  const filtered = TOOLS.filter(t => t.name.toLowerCase().includes(q));
  grid.innerHTML = filtered.map((t,i) => `
    <div class="card" style="border-top-color:${CAT_COLORS[t.cat] || '#242640'}">
      ${t.cat === 'Built-In' ? '<span class="built-badge">OFFICIAL</span>' : ''}

      <h3>${t.name}</h3><p>${t.desc}</p>
      <div class="card-foot"><span>${t.price}</span><a class="card-link" href="${t.url}" target="_blank">Visit ↗</a></div>
    </div>`).join('');
}
searchInput.addEventListener('input', renderCards);
renderCards();
