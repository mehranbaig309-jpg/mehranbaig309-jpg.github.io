const catListEl = document.getElementById('catList');
const searchInput = document.getElementById('searchInput');
let activeCat = "All";
const categories = ["All", ...new Set(TOOLS.map(t=>t.cat))];
function renderCatList(){ catListEl.innerHTML = categories.map(c => `<button class="cat-btn ${c===activeCat?'active':''}" onclick="filterCat('${c}')">${c}</button>`).join(''); }
function filterCat(cat){ activeCat = cat; renderCatList(); renderCards(); }
function renderCards(){
  const q = searchInput.value.toLowerCase();
  const filtered = TOOLS.filter(t => (activeCat==="All" || t.cat===activeCat) && (t.name.toLowerCase().includes(q)));
  grid.innerHTML = filtered.map((t,i) => `<div class="card" style="border-top-color:${CAT_COLORS[t.cat]}"><div style="font-size:11px;">No. ${String(i+32).padStart(3,'0')}</div><h3>${t.name}</h3><p>${t.desc}</p><div class="card-foot"><span>${t.price}</span><a class="card-link" href="${t.url}" target="_blank">Visit ↗</a></div></div>`).join('');
}
searchInput.addEventListener('input', renderCards);
renderCatList(); renderCards();
</script>
