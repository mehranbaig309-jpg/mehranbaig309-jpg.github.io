<script>
const TOOLS = [

  {name:"Poe", cat:"Writing & Chat", desc:"All models in one app.", price:"Free", url:"https://poe.com"},
  {name:"Consensus", cat:"Research", desc:"Scientific paper search.", price:"Free", url:"https://consensus.app"},
  {name:"HeyGen", cat:"Video", desc:"Avatar lip-sync translation.", price:"Paid", url:"https://www.heygen.com"},
  {name:"Leonardo AI", cat:"Image", desc:"Stylized graphic generations.", price:"Free", url:"https://leonardo.ai"},
  {name:"Fireflies.ai", cat:"Productivity", desc:"Record and sync meetings.", price:"Free", url:"https://fireflies.ai"},
  {name:"Grok", cat:"Writing & Chat", desc:"xAI built into X (Twitter).", price:"Paid", url:"https://x.ai/grok"},
  {name:"DeepSeek", cat:"Writing & Chat", desc:"Logic and coding expert AI.", price:"Free", url:"https://www.deepseek.com"},
  {name:"Mistral Le Chat", cat:"Writing & Chat", desc:"Fast multilingual coding assistant.", price:"Free", url:"https://chat.mistral.ai"},
  {name:"Grammarly", cat:"Writing & Chat", desc:"Grammar and clarity checker.", price:"Free", url:"https://www.grammarly.com"},
  {name:"Stable Diffusion", cat:"Image", desc:"Local open-weight image gen.", price:"Free", url:"https://stability.ai"},
  {name:"Krea", cat:"Image", desc:"Real-time design exploration.", price:"Free", url:"https://www.krea.ai"},
  {name:"Luma Dream Machine", cat:"Video", desc:"Realistic fluid motion clips.", price:"Free", url:"https://lumalabs.ai/dream-machine"},
  {name:"Kling AI", cat:"Video", desc:"Long high-fidelity AI video.", price:"Free", url:"https://klingai.com"},
  {name:"Opus Clip", cat:"Video", desc:"Short clips for TikTok/Reels.", price:"Free", url:"https://www.opus.pro"},
  {name:"Lovable", cat:"Code", desc:"Prompt-to-app for non-engineers.", price:"Free", url:"https://lovable.dev"},
  {name:"Reflect", cat:"Productivity", desc:"AI linked note-taking.", price:"Paid", url:"https://reflect.app"},
  {name:"Mem", cat:"Productivity", desc:"Self-organizing workspace.", price:"Free", url:"https://mem.ai"},
  {name:"Tome", cat:"Design & Slides", desc:"AI storytelling decks.", price:"Free", url:"https://tome.app"},
  {name:"Beautiful.ai", cat:"Design & Slides", desc:"Automatic smart slide design.", price:"Paid", url:"https://www.beautiful.ai"},
  {name:"AIVA", cat:"Audio", desc:"Original instrumental soundtracks.", price:"Free", url:"https://www.aiva.ai"},
  {name:"Murf", cat:"Audio", desc:"Professional voiceover studio.", price:"Free", url:"https://murf.ai"},
  {name:"Semantic Scholar", cat:"Research", desc:"AI-powered paper summaries.", price:"Free", url:"https://www.semanticscholar.org"},
  {name:"Humata", cat:"Research", desc:"Chat with any PDF instantly.", price:"Free", url:"https://www.humata.ai"}
];
const CAT_COLORS = {"Writing & Chat":"#5B54D6", "Research":"#0E8F82", "Image":"#E85C42", "Video":"#E8A73B", "Audio":"#2F80ED", "Code":"#2FA84F", "Productivity":"#D6336C", "Design & Slides":"#9D5CE0"};
const grid = document.getElementById('cardsGrid');
const catListEl = document.getElementById('catList');
const searchInput = document.getElementById('searchInput');
let activeCat = "All";
const categories = ["All", ...new Set(TOOLS.map(t=>t.cat))];
function renderCatList(){ catListEl.innerHTML = categories.map(c => `<button class="cat-btn ${c===activeCat?'active':''}" onclick="filterCat('${c}')">${c}</button>`).join(''); }
function filterCat(cat){ activeCat = cat; renderCatList(); renderCards(); }
function renderCards(){
  const q = searchInput.value.toLowerCase();
  const filtered = TOOLS.filter(t => (activeCat==="All" || t.cat===activeCat) && (t.name.toLowerCase().includes(q)));
  grid.innerHTML = filtered.map((t,i) => `
    <div class="card" style="border-top-color:${CAT_COLORS[t.cat]}">
      <div style="font-size:11px;">No. ${String(i+32).padStart(3,'0')}</div>
      <h3>${t.name}</h3><p>${t.desc}</p>
      <div class="card-foot"><span>${t.price}</span><a class="card-link" href="${t.url}" target="_blank">Visit ↗</a></div>
    </div>`).join('');
}
searchInput.addEventListener('input', renderCards);
renderCatList(); renderCards();
</script>
